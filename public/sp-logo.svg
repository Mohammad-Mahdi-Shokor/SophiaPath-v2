<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      .logo-right {
        fill: #2E49D1;
      }
      @media (prefers-color-scheme: dark) {
        .logo-right {
          fill: #7186ff;
        }
      }
    </style>
    <mask id="logo-mask">
      <image width="64" height="64" href="data:image/png;base64," />
    </mask>
  </defs>
  <g mask="url(#logo-mask)">
    <rect x="0" y="0" width="32" height="64" fill="#3D5CFF" />
    <rect x="32" y="0" width="32" height="64" class="logo-right" />
  </g>
</svg>